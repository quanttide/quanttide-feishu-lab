# 招聘流程定义
#
# 流程是数据，不是代码：改流程 = 改这份文件，执行器读它跑。
# 每个迁移标两件事：触发（什么事件让它发生）与执行者（人 / 系统 / 半自动）。
# 「人」是当前实情，不是应有形态——流程升级的方向就是把执行者从人换成系统。
#
# 检查：只有「执行者：系统」的迁移需要写检查——那是一段机器可判的条件，
# 成立才推。执行者是人或半自动的，执行器不代劳，只把它记成待办。
#
# 依据：qtrecurit-private/docs/handbook/workflow.md（2026-08 按实际运行更新）

流程: 招聘
来源: 飞书
版本: 0.1.0

# ── 对接范围：拉哪些地方 ────────────────────────────────────────
# 卡点：HR 处理邮件时会把邮件移进「已发送问卷」「沟通面试中」等文件夹，
#      只拉收件箱会漏投递；有效投递还可能被 Spam 误判（且 Spam 里的附件下载受限）。
收集:
  邮箱: hr@quanttide.com
  范围:
    - 收件箱
    - 已发送问卷
    - 沟通面试中
    - Spam          # 需先移回收件箱再取附件
  对象:
    - 邮件（含附件）
    - 问卷记录      # 飞书知识库「量潮招聘第二大脑」→「量潮招聘工作档案」→「调研」表
    - 群成员        # 实训基地群
  游标: 按文件夹各存一个，增量拉取

# ── 状态 ───────────────────────────────────────────────────────
状态:
  - 投递          # 候选人出现在收件箱
  - 问卷已发
  - 问卷已交
  - 无响应        # 问卷发出后未交（可被「问卷已交」复活）
  - 已进群
  - 已建清单      # candidates.csv / documents.csv 生成
  - 已评估        # 评估报告完成
  - 推荐池
  - 已推荐
  - 推荐成功
  - 不推荐

# ── 迁移 ───────────────────────────────────────────────────────
迁移:
  - 从: 投递
    到: 问卷已发
    触发: 发出问卷邮件
    执行者: 人               # 现在靠人工一封封发
    副作用: 记发送时间；把该邮件移入「已发送问卷」文件夹

  - 从: 问卷已发
    到: 问卷已交
    触发: 调研表出现该邮箱的记录
    执行者: 系统             # 表里出现即状态变化
    检查:
      能力: read_survey
      参数: { emails: ["{{候选人.邮箱}}"] }
      成立: 非空
    副作用: 关掉该候选人的「无响应」计时

  - 从: 问卷已发
    到: 无响应
    触发: 发出超过 N 天仍无记录
    执行者: 系统
    检查:
      能力: _since       # 从该候选人进入当前状态算起的天数
      成立: 超过天数
      天数: 7            # N：说改就改，代码不动
    副作用: 记入待跟进清单

  - 从: 问卷已交
    到: 已进群
    触发: 群成员名单里出现该邮箱
    执行者: 人               # 现在人工发邀请
    副作用: 记进群时间

  - 从: 已进群
    到: 已建清单
    触发: 当月清单生成
    执行者: 半自动           # 系统生成，姓名/岗位/附件类型需人工核对
    副作用: 写 candidates.csv / documents.csv

  - 从: 已建清单
    到: 已评估
    触发: 评估报告完成
    执行者: 人               # 准则：了解度与留存优先
    副作用: 写 data/report/YYYY-MM-{candidates-ranking,survey}.md

  - 从: 已评估
    到: 推荐池
    触发: 命中准入底线（责任心 ≥ 中 + 材料真实）
    执行者: 人
    副作用: 标记推荐列；淘汰组不进池

  - 从: 推荐池
    到: 已推荐
    触发: 匹配到企业需求单 + 候选人知情同意
    执行者: 半自动
    副作用: 生成唯一凭证（编号 + 候选人邮箱 + 企业邮箱 + 时间戳）并发出

  - 从: 已推荐
    到: 推荐成功
    触发: 企业反馈入职
    执行者: 人
    副作用: 入 referrals.csv 台账；结果回灌评估模型

# ── 终止与复活 ─────────────────────────────────────────────────
终止:
  - 不推荐         # 不推荐 ≠ 淘汰，两条线分开走
  - 推荐成功

复活:
  - 无响应 → 问卷已交     # 迟交的问卷照样成立

# ── 待定（卡点分析的产物，先留空，不编）────────────────────────
待定:
  - 无响应的天数 N
  - 问卷发出后的催促节奏
  - 文件夹漂移的自动补拉范围（现在靠人记得）
  - Spam 里有效投递的自动识别
